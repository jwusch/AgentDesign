<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arXiv Paper Chat</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Lucide icons as SVG components
        const FileText = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
        );

        const Zap = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
        );

        const ExternalLink = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
        );

        const Download = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        );

        const BookOpen = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
        );

        const Brain = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"></path>
                <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"></path>
            </svg>
        );

        const Shield = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
        );

        const Eye = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        );

        function ArxivChatApp() {
            const [selectedBot, setSelectedBot] = useState(null);
            const [selectedPaper, setSelectedPaper] = useState(null);
            const [view, setView] = useState('papers');

            const bots = [
                {
                    id: 1,
                    name: 'PDF Chatbot',
                    author: 'cvachet',
                    likes: 369,
                    description: 'Most popular option - Simple and effective interface for asking questions about your PDF documents',
                    url: 'https://huggingface.co/spaces/cvachet/pdf-chatbot',
                    icon: FileText,
                    color: 'from-blue-500 to-cyan-500'
                },
                {
                    id: 2,
                    name: 'RAG PDF Chatbot',
                    author: 'MuntasirHossain',
                    likes: 68,
                    description: 'Uses RAG (Retrieval-Augmented Generation) for better accuracy when querying PDF documents',
                    url: 'https://huggingface.co/spaces/MuntasirHossain/RAG-PDF-Chatbot',
                    icon: Zap,
                    color: 'from-purple-500 to-pink-500'
                }
            ];

            const papers = [
                {
                    category: 'LLM Reasoning & Training',
                    icon: Brain,
                    color: 'from-purple-500 to-pink-500',
                    papers: [
                        {
                            title: 'LightReasoner: Can Small Language Models Teach Large Language Models Reasoning?',
                            authors: 'Jingyuan Wang et al.',
                            date: 'Oct 2025',
                            likes: 7,
                            description: 'A counterintuitive approach where smaller models help train larger ones to reason better. Achieved 28.1% improvement while reducing computation by 90%.',
                            url: 'https://hf.co/papers/2510.07962',
                            pdfUrl: 'https://arxiv.org/pdf/2510.07962'
                        },
                        {
                            title: 'BoostStep: Boosting mathematical capability of LLMs',
                            authors: 'Beichen Zhang et al.',
                            date: 'Jan 2025',
                            likes: 44,
                            description: 'Focuses on improving step-by-step mathematical reasoning. Works great with GPT-4o and Qwen models.',
                            url: 'https://hf.co/papers/2501.03226',
                            pdfUrl: 'https://arxiv.org/pdf/2501.03226'
                        },
                        {
                            title: 'The Impact of Reasoning Step Length on Large Language Models',
                            authors: 'Mingyu Jin et al.',
                            date: 'Jan 2024',
                            likes: 18,
                            description: 'Fascinating finding: longer reasoning steps improve LLM performance, even without adding new information!',
                            url: 'https://hf.co/papers/2401.04925',
                            pdfUrl: 'https://arxiv.org/pdf/2401.04925'
                        },
                        {
                            title: 'Divide and Conquer for Large Language Models Reasoning',
                            authors: 'Zijie Meng et al.',
                            date: 'Jan 2024',
                            likes: 1,
                            description: 'Applies divide-and-conquer strategy to LLM reasoning, categorizing tasks by difficulty and handling them individually.',
                            url: 'https://hf.co/papers/2401.05190',
                            pdfUrl: 'https://arxiv.org/pdf/2401.05190'
                        },
                        {
                            title: 'Training LLMs for Reasoning through Reverse Curriculum RL',
                            authors: 'Zhiheng Xi et al.',
                            date: 'Feb 2024',
                            likes: 0,
                            description: 'R³ method uses outcome supervision to achieve benefits of process supervision through reverse curriculum learning.',
                            url: 'https://hf.co/papers/2402.05808',
                            pdfUrl: 'https://arxiv.org/pdf/2402.05808'
                        }
                    ]
                },
                {
                    category: 'AI Safety & Alignment',
                    icon: Shield,
                    color: 'from-green-500 to-emerald-500',
                    papers: [
                        {
                            title: 'Alignment and Safety in Large Language Models: A Comprehensive Survey',
                            authors: 'Haoran Lu et al.',
                            date: 'Jul 2025',
                            likes: 0,
                            description: 'Covers Constitutional AI, Direct Preference Optimization, and other alignment techniques. Perfect for understanding how models are made safer.',
                            url: 'https://hf.co/papers/2507.19672',
                            pdfUrl: 'https://arxiv.org/pdf/2507.19672'
                        }
                    ]
                },
                {
                    category: 'Vision-Language Models',
                    icon: Eye,
                    color: 'from-blue-500 to-cyan-500',
                    papers: [
                        {
                            title: 'AlignVLM: Bridging Vision and Language Latent Spaces',
                            authors: 'Ahmed Masry et al.',
                            date: 'Feb 2025',
                            likes: 38,
                            description: 'Novel approach to connecting visual and language understanding. Especially good for document understanding.',
                            url: 'https://hf.co/papers/2502.01341',
                            pdfUrl: 'https://arxiv.org/pdf/2502.01341'
                        },
                        {
                            title: 'DeepSeek-VL2: Mixture-of-Experts Vision-Language Models',
                            authors: 'Zhiyu Wu et al.',
                            date: 'Dec 2024',
                            likes: 17,
                            description: 'State-of-the-art multimodal model with dynamic image tiling. Handles high-resolution images with different aspect ratios.',
                            url: 'https://hf.co/papers/2412.10302',
                            pdfUrl: 'https://arxiv.org/pdf/2412.10302'
                        },
                        {
                            title: 'Vision-Language-Action Models Survey',
                            authors: 'Yifan Zhong et al.',
                            date: 'Jul 2025',
                            likes: 38,
                            description: 'Explores how AI models translate visual understanding into physical actions. Bridges perception and embodied intelligence.',
                            url: 'https://hf.co/papers/2507.01925',
                            pdfUrl: 'https://arxiv.org/pdf/2507.01925'
                        },
                        {
                            title: 'MMC: Advancing Multimodal Chart Understanding',
                            authors: 'Fuxiao Liu et al.',
                            date: 'Nov 2023',
                            likes: 1,
                            description: 'Large-scale instruction tuning for chart understanding. Includes comprehensive benchmark for evaluating LMMs on chart tasks.',
                            url: 'https://hf.co/papers/2311.10774',
                            pdfUrl: 'https://arxiv.org/pdf/2311.10774'
                        }
                    ]
                }
            ];

            const handleSelectBot = (bot) => {
                setSelectedBot(bot);
                setView('chat');
            };

            const handleOpenInNewTab = (url) => {
                window.open(url, '_blank', 'noopener,noreferrer');
            };

            const handleSelectPaper = (paper) => {
                setSelectedPaper(paper);
            };

            const handleProceedToBots = () => {
                setView('bots');
            };

            if (view === 'chat' && selectedBot) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 p-4">
                        <div className="max-w-6xl mx-auto">
                            <div className="mb-6 flex items-center justify-between flex-wrap gap-3">
                                <div className="flex gap-3">
                                    <button
                                        onClick={() => setView('bots')}
                                        className="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg transition-colors"
                                    >
                                        ← Back to Bots
                                    </button>
                                    <button
                                        onClick={() => setView('papers')}
                                        className="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg transition-colors"
                                    >
                                        📚 Browse Papers
                                    </button>
                                </div>
                                <button
                                    onClick={() => handleOpenInNewTab(selectedBot.url)}
                                    className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition-colors flex items-center gap-2"
                                >
                                    Open in New Tab
                                    <ExternalLink size={16} />
                                </button>
                            </div>

                            <div className="bg-gray-800 rounded-xl p-4 mb-4 border border-gray-700">
                                <h2 className="text-2xl font-bold text-white mb-2">{selectedBot.name}</h2>
                                <p className="text-gray-400 text-sm">by {selectedBot.author} • {selectedBot.likes} likes</p>
                                {selectedPaper && (
                                    <div className="mt-3 pt-3 border-t border-gray-600">
                                        <p className="text-sm text-gray-400">Selected Paper:</p>
                                        <p className="text-white font-semibold">{selectedPaper.title}</p>
                                    </div>
                                )}
                            </div>

                            <div className="bg-white rounded-xl shadow-2xl overflow-hidden" style={{ height: '700px' }}>
                                <iframe
                                    src={selectedBot.url}
                                    className="w-full h-full"
                                    title={selectedBot.name}
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                />
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'bots') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 p-8">
                        <div className="max-w-4xl mx-auto">
                            <div className="mb-6">
                                <button
                                    onClick={() => setView('papers')}
                                    className="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg transition-colors"
                                >
                                    ← Back to Papers
                                </button>
                            </div>

                            <div className="text-center mb-12">
                                <h1 className="text-5xl font-bold text-white mb-4">
                                    Select Your AI Chatbot
                                </h1>
                                <p className="text-gray-400 text-lg">
                                    Choose a chatbot to analyze your selected paper
                                </p>
                                {selectedPaper && (
                                    <div className="mt-4 bg-gray-800 rounded-lg p-4 border border-gray-700">
                                        <p className="text-sm text-gray-400">Selected Paper:</p>
                                        <p className="text-white font-semibold">{selectedPaper.title}</p>
                                    </div>
                                )}
                            </div>

                            <div className="grid md:grid-cols-2 gap-6">
                                {bots.map((bot) => {
                                    const Icon = bot.icon;
                                    return (
                                        <div
                                            key={bot.id}
                                            className="bg-gray-800 rounded-xl p-6 border border-gray-700 hover:border-gray-600 transition-all hover:shadow-xl hover:scale-105 cursor-pointer"
                                            onClick={() => handleSelectBot(bot)}
                                        >
                                            <div className={`w-16 h-16 rounded-lg bg-gradient-to-br ${bot.color} flex items-center justify-center mb-4`}>
                                                <Icon size={32} />
                                            </div>

                                            <h3 className="text-2xl font-bold text-white mb-2">
                                                {bot.name}
                                            </h3>

                                            <p className="text-gray-400 text-sm mb-4">
                                                by {bot.author} • {bot.likes} likes
                                            </p>

                                            <p className="text-gray-300 mb-6">
                                                {bot.description}
                                            </p>

                                            <div className="flex gap-3">
                                                <button
                                                    className="flex-1 px-4 py-2 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white rounded-lg transition-all font-semibold"
                                                    onClick={(e) => {
                                                        e.stopPropagation();
                                                        handleSelectBot(bot);
                                                    }}
                                                >
                                                    Use This Bot
                                                </button>
                                                <button
                                                    className="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg transition-colors"
                                                    onClick={(e) => {
                                                        e.stopPropagation();
                                                        handleOpenInNewTab(bot.url);
                                                    }}
                                                >
                                                    <ExternalLink size={18} />
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 p-8">
                    <div className="max-w-6xl mx-auto">
                        <div className="text-center mb-12">
                            <h1 className="text-5xl font-bold text-white mb-4">
                                arXiv Paper Chat
                            </h1>
                            <p className="text-gray-400 text-lg mb-6">
                                Browse cutting-edge AI research papers and chat with them using AI
                            </p>
                            {selectedPaper && (
                                <button
                                    onClick={handleProceedToBots}
                                    className="px-6 py-3 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white rounded-lg font-semibold transition-all shadow-lg hover:shadow-xl"
                                >
                                    Proceed to Select Chatbot →
                                </button>
                            )}
                        </div>

                        {papers.map((category, idx) => {
                            const CategoryIcon = category.icon;
                            return (
                                <div key={idx} className="mb-10">
                                    <div className="flex items-center gap-3 mb-6">
                                        <div className={`w-12 h-12 rounded-lg bg-gradient-to-br ${category.color} flex items-center justify-center`}>
                                            <CategoryIcon size={24} />
                                        </div>
                                        <h2 className="text-3xl font-bold text-white">{category.category}</h2>
                                    </div>

                                    <div className="grid gap-4">
                                        {category.papers.map((paper, paperIdx) => (
                                            <div
                                                key={paperIdx}
                                                className={`bg-gray-800 rounded-xl p-6 border-2 transition-all hover:shadow-xl ${
                                                    selectedPaper?.title === paper.title
                                                        ? 'border-blue-500 bg-gray-750'
                                                        : 'border-gray-700 hover:border-gray-600'
                                                }`}
                                            >
                                                <div className="flex justify-between items-start gap-4 mb-3">
                                                    <div className="flex-1">
                                                        <h3 className="text-xl font-bold text-white mb-2">
                                                            {paper.title}
                                                        </h3>
                                                        <div className="flex items-center gap-4 text-sm text-gray-400 mb-3">
                                                            <span>{paper.authors}</span>
                                                            <span>•</span>
                                                            <span>{paper.date}</span>
                                                            {paper.likes > 0 && (
                                                                <>
                                                                    <span>•</span>
                                                                    <span>⭐ {paper.likes} likes</span>
                                                                </>
                                                            )}
                                                        </div>
                                                    </div>
                                                    <button
                                                        onClick={() => handleSelectPaper(paper)}
                                                        className={`px-4 py-2 rounded-lg font-semibold transition-all ${
                                                            selectedPaper?.title === paper.title
                                                                ? 'bg-blue-600 text-white'
                                                                : 'bg-gray-700 text-gray-300 hover:bg-gray-600'
                                                        }`}
                                                    >
                                                        {selectedPaper?.title === paper.title ? '✓ Selected' : 'Select'}
                                                    </button>
                                                </div>

                                                <p className="text-gray-300 mb-4">{paper.description}</p>

                                                <div className="flex gap-3">
                                                    <button
                                                        onClick={() => handleOpenInNewTab(paper.pdfUrl)}
                                                        className="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 text-white rounded-lg transition-all font-semibold"
                                                    >
                                                        <Download size={18} />
                                                        Download PDF
                                                    </button>
                                                    <button
                                                        onClick={() => handleOpenInNewTab(paper.url)}
                                                        className="flex items-center gap-2 px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg transition-colors"
                                                    >
                                                        <BookOpen size={18} />
                                                        View on HF
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })}

                        <div className="mt-12 bg-gray-800 rounded-xl p-6 border border-gray-700">
                            <h3 className="text-xl font-bold text-white mb-3">How to Use:</h3>
                            <ol className="text-gray-300 space-y-2">
                                <li>1. Browse the papers above and select one that interests you</li>
                                <li>2. Click "Download PDF" to get the paper</li>
                                <li>3. Click "Proceed to Select Chatbot" to choose your AI assistant</li>
                                <li>4. Upload the PDF to the chatbot and start asking questions!</li>
                            </ol>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ArxivChatApp />);
    </script>
</body>
</html>
